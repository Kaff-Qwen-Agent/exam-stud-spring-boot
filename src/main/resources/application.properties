
# ===============================
# DATABASE
# ===============================
 
# spring.datasource.driver-class-name=com.mysql.jdbc.Driver
# spring.datasource.url=jdbc:mysql://localhost:3306/gr?useUnicode=true&serverTimezone=UTC
# spring.datasource.username=root
# spring.datasource.password=root

spring.datasource.url=jdbc:h2:mem:gr;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:Grops_Studs_2021.sql
spring.jpa.hibernate.ddl-auto=none
# Отключаем Bean Validation при persist: группа создается пустой,
# ограничение @ValidStudentCount проверяется вручную в addStudents
spring.jpa.properties.javax.persistence.validation.mode=none
jwt.secret=secret-key
jwt.expiration-ms=3600000
 
# ===============================
# JPA / HIBERNATE
# ===============================
 
spring.jpa.show-sql=true
spring.jackson.serialization.fail-on-empty-beans=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
